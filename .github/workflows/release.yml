name: Release attested pack

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$env:TAG_NAME' is not a semantic version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build pack
        shell: pwsh
        working-directory: ZscalerViaCriblwithASIM
        env:
          PACK_VERSION: ${{ steps.version.outputs.value }}
        run: .\scripts\Build-Pack.ps1 -Version $env:PACK_VERSION

      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ZscalerViaCriblwithASIM/dist/ZscalerViaCriblwithASIM-${{ steps.version.outputs.value }}.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PACK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $archive = "ZscalerViaCriblwithASIM/dist/ZscalerViaCriblwithASIM-$env:PACK_VERSION.zip"
          gh release create $env:TAG_NAME `
            $archive `
            "$archive.sha256" `
            --repo $env:REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title "Zscaler via Cribl with ASIM $env:PACK_VERSION"
