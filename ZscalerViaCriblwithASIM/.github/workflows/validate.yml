name: Validate Sentinel content pack

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate portable artifacts
        shell: pwsh
        run: |
          az bicep version
          .\scripts\Validate-Pack.ps1 -SkipLiveKql

  windows-powershell-51:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse the deployment script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\Deploy-Pack.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }

      - name: Scan for committed secret values
        shell: pwsh
        run: |
          $patterns = `
            '(?i)(client_secret|access_token|refresh_token|api_key|password)\s*[:=]\s*["''][^"''<>\s]{16,}["'']', `
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          foreach ($pattern in $patterns) {
            $matches = Get-ChildItem -Recurse -File |
              Where-Object FullName -NotMatch '\\.git\\' |
              Select-String -Pattern $pattern
            if ($matches) {
              throw "Potential secret value detected."
            }
          }
